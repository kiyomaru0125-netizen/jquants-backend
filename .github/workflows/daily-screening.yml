name: Daily high-dividend screening mail

on:
  schedule:
    # 平日 18:00(日本時間) = 09:00(UTC)。GitHub側の都合で数分〜数十分遅れることがあります
    - cron: '0 9 * * 1-5'
  workflow_dispatch: {} # 手動実行用のボタン(動作確認に使う)

jobs:
  mail:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 前回該当銘柄(data/last_matches.json)をcommitし直すために必要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send screening result
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/send_screening_mail.py
      - name: Save today's matches for tomorrow's diff
        # 翌日のメールで「新規該当/該当から外れた」銘柄を表示するため、今回の結果をcommitしておく。
        # 初回はファイルがまだgit管理下に無く`git diff`では変化を検知できないため、
        # 新規/変更どちらも拾える`git status --porcelain`で判定する。
        run: |
          if [ -n "$(git status --porcelain -- data/last_matches.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/last_matches.json
            git commit -m "chore: update last_matches.json"
            git push
          else
            echo "変化なし(コミットしない)"
          fi
